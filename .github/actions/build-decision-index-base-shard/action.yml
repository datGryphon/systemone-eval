name: Build Decision Index base shard
description: Rebuild one complete Decision Index base builder group.

inputs:
  decision-index:
    description: Path to Decision Index CLI.
    required: true
  catalog-ids:
    description: Space-separated catalog IDs handled by one shared normalizer.
    required: true
  work-dir:
    description: Temporary Decision Index rebuild workspace.
    required: true

runs:
  using: composite
  steps:
    - name: Rebuild base builder group
      shell: bash
      env:
        DECISION_INDEX: ${{ inputs.decision-index }}
        CATALOG_IDS: ${{ inputs.catalog-ids }}
        WORK_DIR: ${{ inputs.work-dir }}
      run: |
        read -ra ids <<< "$CATALOG_IDS"
        "$DECISION_INDEX" suite rebuild --edition 0.1 --work "$WORK_DIR" --only "${ids[@]}"
