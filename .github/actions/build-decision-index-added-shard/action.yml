name: Build Decision Index added shard
description: Rebuild one Decision Index 0.2.x added benchmark.

inputs:
  decision-index:
    description: Path to Decision Index CLI.
    required: true
  edition:
    description: Decision Index edition.
    required: true
  catalog-id:
    description: Decision Index added catalog ID.
    required: true
  work-dir:
    description: Temporary Decision Index rebuild workspace.
    required: true

runs:
  using: composite
  steps:
    - name: Rebuild added benchmark
      shell: bash
      env:
        DECISION_INDEX: ${{ inputs.decision-index }}
        EDITION: ${{ inputs.edition }}
        CATALOG_ID: ${{ inputs.catalog-id }}
        WORK_DIR: ${{ inputs.work-dir }}
      run: >-
        "$DECISION_INDEX" suite rebuild --edition "$EDITION" --work "$WORK_DIR" --only "$CATALOG_ID"
