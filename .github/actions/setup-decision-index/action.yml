name: Set up Decision Index
description: Check out and install a pinned Decision Index CLI.

inputs:
  ref:
    description: Exact Decision Index commit or tag.
    required: true
  path:
    description: Checkout path relative to the workspace.
    required: false
    default: .deps/decision-index
  rebuild:
    description: Install Decision Index rebuild dependencies.
    required: false
    default: 'false'

outputs:
  executable:
    description: Absolute path to the Decision Index CLI.
    value: ${{ steps.paths.outputs.executable }}
  python-path:
    description: Absolute path to the Decision Index environment Python.
    value: ${{ steps.paths.outputs.python-path }}
  hf-path:
    description: Absolute path to the hf CLI installed with huggingface_hub.
    value: ${{ steps.paths.outputs.hf-path }}

runs:
  using: composite
  steps:
    - name: Check out Decision Index
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: apolinario/decision-index
        ref: ${{ inputs.ref }}
        path: ${{ inputs.path }}
        persist-credentials: false

    - name: Create environment
      shell: bash
      env:
        SOURCE_PATH: ${{ inputs.path }}
        INSTALL_REBUILD: ${{ inputs.rebuild }}
      run: |
        python3 -m venv "$GITHUB_WORKSPACE/.deps/decision-index-venv"
        target="$SOURCE_PATH"
        if [[ "$INSTALL_REBUILD" == "true" ]]; then
          target="$SOURCE_PATH[rebuild]"
        fi
        "$GITHUB_WORKSPACE/.deps/decision-index-venv/bin/python" -m pip install --disable-pip-version-check --editable "$target"

    - name: Publish tool paths
      id: paths
      shell: bash
      run: |
        echo "executable=$GITHUB_WORKSPACE/.deps/decision-index-venv/bin/decision-index" >> "$GITHUB_OUTPUT"
        echo "python-path=$GITHUB_WORKSPACE/.deps/decision-index-venv/bin/python" >> "$GITHUB_OUTPUT"
        echo "hf-path=$GITHUB_WORKSPACE/.deps/decision-index-venv/bin/hf" >> "$GITHUB_OUTPUT"
