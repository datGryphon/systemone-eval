name: Publish Decision Index artifact
description: Publish a validated shard or frozen suite to the private Hugging Face dataset.

inputs:
  python-path:
    description: Python interpreter with huggingface_hub installed.
    required: true
  repo:
    description: Hugging Face dataset repository ID.
    required: true
  kind:
    description: Artifact kind (base, added, or suite).
    required: true
  catalog-id:
    description: Catalog ID for added shards.
    required: false
    default: ''
  group-key:
    description: Builder group key for base shards.
    required: false
    default: ''
  catalog-ids:
    description: JSON catalog ID array for base shards.
    required: false
    default: ''
  source:
    description: Artifact directory to publish.
    required: true

runs:
  using: composite
  steps:
    - name: Publish base shard
      if: inputs.kind == 'base'
      shell: bash
      env:
        PYTHON_PATH: ${{ inputs.python-path }}
        HF_REPO: ${{ inputs.repo }}
        GROUP_KEY: ${{ inputs.group-key }}
        CATALOG_IDS: ${{ inputs.catalog-ids }}
        SOURCE: ${{ inputs.source }}
      run: >-
        "$PYTHON_PATH" "$GITHUB_WORKSPACE/scripts/publish_hf.py" --repo "$HF_REPO" --stack "$GITHUB_WORKSPACE/stack.json" --kind base --group-key "$GROUP_KEY" --catalog-ids-json "$CATALOG_IDS" --source "$SOURCE"

    - name: Publish added shard
      if: inputs.kind == 'added'
      shell: bash
      env:
        PYTHON_PATH: ${{ inputs.python-path }}
        HF_REPO: ${{ inputs.repo }}
        CATALOG_ID: ${{ inputs.catalog-id }}
        SOURCE: ${{ inputs.source }}
      run: >-
        "$PYTHON_PATH" "$GITHUB_WORKSPACE/scripts/publish_hf.py" --repo "$HF_REPO" --stack "$GITHUB_WORKSPACE/stack.json" --kind added --catalog-id "$CATALOG_ID" --source "$SOURCE"

    - name: Publish frozen suite
      if: inputs.kind == 'suite'
      shell: bash
      env:
        PYTHON_PATH: ${{ inputs.python-path }}
        HF_REPO: ${{ inputs.repo }}
        SOURCE: ${{ inputs.source }}
      run: >-
        "$PYTHON_PATH" "$GITHUB_WORKSPACE/scripts/publish_hf.py" --repo "$HF_REPO" --stack "$GITHUB_WORKSPACE/stack.json" --kind suite --source "$SOURCE"
