name: Set up llama.cpp
description: Build llama-server at the pinned ref.

inputs:
  ref:
    required: true

outputs:
  server-path:
    value: ${{ steps.path.outputs.server-path }}

runs:
  using: composite
  steps:
    - name: Check out llama.cpp
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ggml-org/llama.cpp
        ref: ${{ inputs.ref }}
        path: .deps/llama.cpp
        persist-credentials: false

    - name: Build llama-server
      shell: bash
      run: |
        cmake -S .deps/llama.cpp -B .deps/llama.cpp/build -DCMAKE_BUILD_TYPE=Release
        cmake --build .deps/llama.cpp/build --target llama-server --parallel

    - id: path
      shell: bash
      run: echo "server-path=$GITHUB_WORKSPACE/.deps/llama.cpp/build/bin/llama-server" >> "$GITHUB_OUTPUT"
