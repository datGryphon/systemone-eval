name: Run System One smoke
description: Run one llama.cpp decision-model profile and capture latency and process memory.

inputs:
  server-path:
    description: Path to llama-server.
    required: true
  model-profile:
    description: Profile key from models.json.
    required: true
  output-dir:
    description: Artifact output directory.
    required: false
    default: artifacts

outputs:
  metrics-path:
    description: Path to the generated metrics JSON.
    value: ${{ steps.run.outputs.metrics-path }}

runs:
  using: composite
  steps:
    - name: Run smoke request
      id: run
      shell: bash
      env:
        SERVER_PATH: ${{ inputs.server-path }}
        MODEL_PROFILE: ${{ inputs.model-profile }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/systemone_smoke.py" \
          --server "$SERVER_PATH" \
          --models "$GITHUB_WORKSPACE/models.json" \
          --profile "$MODEL_PROFILE" \
          --stack "$GITHUB_WORKSPACE/stack.json" \
          --output "$OUTPUT_DIR"
        echo "metrics-path=$OUTPUT_DIR/metrics.json" >> "$GITHUB_OUTPUT"
