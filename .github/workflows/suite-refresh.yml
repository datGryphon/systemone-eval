name: Refresh Decision Index suite

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-index-suite-refresh
  cancel-in-progress: false

jobs:
  plan:
    name: Plan pinned suite
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.matrix.outputs.base }}
      added: ${{ steps.matrix.outputs.added }}
      base-ids: ${{ steps.matrix.outputs.base-ids }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require private HF destination
        env:
          HF_SUITE_REPO: ${{ vars.HF_SUITE_REPO }}
        run: test -n "$HF_SUITE_REPO"

      - name: Read pinned stack
        id: stack
        uses: ./.github/actions/read-stack

      - name: Set up Decision Index
        id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ steps.stack.outputs.decision-index-ref }}

      - name: Derive shard matrix from pinned Decision Index
        id: matrix
        env:
          PYTHON_PATH: ${{ steps.decision-index.outputs.python-path }}
        run: >-
          "$PYTHON_PATH" scripts/suite_plan.py --github-output "$GITHUB_OUTPUT"

  base:
    name: Base shard / ${{ matrix.key }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.base) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned stack
        id: stack
        uses: ./.github/actions/read-stack

      - name: Set up Decision Index rebuild environment
        id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ steps.stack.outputs.decision-index-ref }}
          rebuild: 'true'

      - name: Rebuild base shard
        uses: ./.github/actions/build-decision-index-base-shard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
        with:
          decision-index: ${{ steps.decision-index.outputs.executable }}
          catalog-ids: ${{ matrix.catalog_ids }}
          work-dir: work/base-${{ matrix.key }}

      - name: Publish normalized shard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_SUITE_REPO: ${{ vars.HF_SUITE_REPO }}
          EDITION: ${{ steps.stack.outputs.decision-index-edition }}
          DI_REF: ${{ steps.stack.outputs.decision-index-ref }}
          KEY: ${{ matrix.key }}
        run: >-
          "$HF" upload "$HF_SUITE_REPO"
          "work/base-$KEY/artifacts/benchmark-suite/normalized"
          "decision-index/$EDITION/$DI_REF/base/$KEY/normalized"
          --repo-type dataset
          --commit-message "systemone-eval: publish base shard $KEY"

  added:
    name: Added shard / ${{ matrix.key }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.added) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned stack
        id: stack
        uses: ./.github/actions/read-stack

      - name: Set up Decision Index rebuild environment
        id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ steps.stack.outputs.decision-index-ref }}
          rebuild: 'true'

      - name: Rebuild added shard
        uses: ./.github/actions/build-decision-index-added-shard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
        with:
          decision-index: ${{ steps.decision-index.outputs.executable }}
          edition: ${{ steps.stack.outputs.decision-index-edition }}
          catalog-id: ${{ matrix.catalog_id }}
          work-dir: work/added-${{ matrix.key }}

      - name: Publish added shard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_SUITE_REPO: ${{ vars.HF_SUITE_REPO }}
          EDITION: ${{ steps.stack.outputs.decision-index-edition }}
          DI_REF: ${{ steps.stack.outputs.decision-index-ref }}
          KEY: ${{ matrix.key }}
        run: >-
          "$HF" upload "$HF_SUITE_REPO"
          "work/added-$KEY/artifacts/benchmark-suite/release-v2-rebuilt/added-rows.jsonl"
          "decision-index/$EDITION/$DI_REF/added/$KEY/added-rows.jsonl"
          --repo-type dataset
          --commit-message "systemone-eval: publish added shard $KEY"

  assemble:
    name: Assemble canonical suite
    needs:
      - plan
      - base
      - added
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned stack
        id: stack
        uses: ./.github/actions/read-stack

      - name: Set up Decision Index rebuild environment
        id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ steps.stack.outputs.decision-index-ref }}
          rebuild: 'true'

      - name: Assemble, verify, and publish suite
        uses: ./.github/actions/assemble-decision-index-suite
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
        with:
          python-path: ${{ steps.decision-index.outputs.python-path }}
          decision-index: ${{ steps.decision-index.outputs.executable }}
          hf: ${{ steps.decision-index.outputs.hf-path }}
          repo: ${{ vars.HF_SUITE_REPO }}
          edition: ${{ steps.stack.outputs.decision-index-edition }}
          ref: ${{ steps.stack.outputs.decision-index-ref }}
          base-ids: ${{ needs.plan.outputs.base-ids }}
