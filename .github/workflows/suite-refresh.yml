name: Refresh Decision Index suite

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-index-suite-refresh
  cancel-in-progress: false

jobs:
  plan:
    name: Plan suite
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.matrix.outputs.base }}
      added: ${{ steps.matrix.outputs.added }}
      base-ids: ${{ steps.matrix.outputs.base-ids }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned stack
        id: stack
        uses: ./.github/actions/read-stack

      - name: Set up Decision Index
        id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ steps.stack.outputs.decision-index-ref }}

      - name: Build shard matrix
        id: matrix
        env:
          PYTHON: ${{ steps.decision-index.outputs.python-path }}
        run: >-
          "$PYTHON" scripts/suite_plan.py --github-output "$GITHUB_OUTPUT"

  base:
    name: Base / ${{ matrix.key }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.base) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned stack
        id: stack
        uses: ./.github/actions/read-stack

      - name: Set up Decision Index
        id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ steps.stack.outputs.decision-index-ref }}
          rebuild: 'true'

      - name: Check private cache
        id: shard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_SUITE_REPO: ${{ vars.HF_SUITE_REPO }}
          PREFIX: decision-index/${{ steps.stack.outputs.decision-index-edition }}/${{ steps.stack.outputs.decision-index-ref }}/base/${{ matrix.key }}/normalized/
        run: |
          if "$HF" datasets ls "$HF_SUITE_REPO" -R | grep -Fq "$PREFIX"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild shard
        if: steps.shard.outputs.exists != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
          DECISION_INDEX: ${{ steps.decision-index.outputs.executable }}
          CATALOG_IDS: ${{ matrix.catalog_ids }}
          WORK: work/base-${{ matrix.key }}
        run: |
          read -ra ids <<< "$CATALOG_IDS"
          "$DECISION_INDEX" suite rebuild --edition 0.1 --work "$WORK" --only "${ids[@]}"

      - name: Publish shard
        if: steps.shard.outputs.exists != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_SUITE_REPO: ${{ vars.HF_SUITE_REPO }}
          SOURCE: work/base-${{ matrix.key }}/artifacts/benchmark-suite/normalized
          DEST: decision-index/${{ steps.stack.outputs.decision-index-edition }}/${{ steps.stack.outputs.decision-index-ref }}/base/${{ matrix.key }}/normalized
        run: >-
          "$HF" upload "$HF_SUITE_REPO" "$SOURCE" "$DEST" --repo-type dataset

  added:
    name: Added / ${{ matrix.key }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.added) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned stack
        id: stack
        uses: ./.github/actions/read-stack

      - name: Set up Decision Index
        id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ steps.stack.outputs.decision-index-ref }}
          rebuild: 'true'

      - name: Check private cache
        id: shard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_SUITE_REPO: ${{ vars.HF_SUITE_REPO }}
          FILE: decision-index/${{ steps.stack.outputs.decision-index-edition }}/${{ steps.stack.outputs.decision-index-ref }}/added/${{ matrix.key }}/added-rows.jsonl
        run: |
          if "$HF" datasets ls "$HF_SUITE_REPO" -R | grep -Fq "$FILE"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild shard
        if: steps.shard.outputs.exists != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
          DECISION_INDEX: ${{ steps.decision-index.outputs.executable }}
          EDITION: ${{ steps.stack.outputs.decision-index-edition }}
          WORK: work/added-${{ matrix.key }}
        run: >-
          "$DECISION_INDEX" suite rebuild
          --edition "$EDITION"
          --work "$WORK"
          --only "${{ matrix.catalog_id }}"

      - name: Publish shard
        if: steps.shard.outputs.exists != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_SUITE_REPO: ${{ vars.HF_SUITE_REPO }}
          SOURCE: work/added-${{ matrix.key }}/artifacts/benchmark-suite/release-v2-rebuilt/added-rows.jsonl
          DEST: decision-index/${{ steps.stack.outputs.decision-index-edition }}/${{ steps.stack.outputs.decision-index-ref }}/added/${{ matrix.key }}/added-rows.jsonl
        run: >-
          "$HF" upload "$HF_SUITE_REPO" "$SOURCE" "$DEST" --repo-type dataset

  assemble:
    name: Assemble canonical suite
    needs: [plan, base, added]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned stack
        id: stack
        uses: ./.github/actions/read-stack

      - name: Set up Decision Index
        id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ steps.stack.outputs.decision-index-ref }}
          rebuild: 'true'

      - name: Assemble, verify, and publish
        uses: ./.github/actions/assemble-decision-index-suite
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
        with:
          decision-index: ${{ steps.decision-index.outputs.executable }}
          repo: ${{ vars.HF_SUITE_REPO }}
          edition: ${{ steps.stack.outputs.decision-index-edition }}
          ref: ${{ steps.stack.outputs.decision-index-ref }}
          base-ids: ${{ needs.plan.outputs.base-ids }}
