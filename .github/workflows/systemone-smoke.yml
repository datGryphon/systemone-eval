name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: System One / Julia-1 Q8
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned stack
        id: stack
        uses: ./.github/actions/read-stack

      - name: Record runner profile
        run: python3 scripts/runner_info.py artifacts/runner.json

      - name: Set up llama.cpp
        id: llama
        uses: ./.github/actions/setup-llama
        with:
          ref: ${{ steps.stack.outputs.llama-cpp-ref }}

      - name: Set up Decision Index
        id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ steps.stack.outputs.decision-index-ref }}

      - name: Run native System One smoke
        uses: ./.github/actions/run-systemone-smoke
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
        with:
          server-path: ${{ steps.llama.outputs.server-path }}
          model-profile: julia-1-q8
          output-dir: artifacts/native-smoke

      - name: Run Decision Index HTTP smoke
        uses: ./.github/actions/run-decision-index-smoke
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
        with:
          server-path: ${{ steps.llama.outputs.server-path }}
          decision-index: ${{ steps.decision-index.outputs.executable }}
          model-profile: julia-1-q8

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: systemone-integration
          path: artifacts/

  base-shard:
    name: Decision Index shard / shared NLI builder
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned stack
        id: stack
        uses: ./.github/actions/read-stack

      - name: Set up Decision Index rebuild environment
        id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ steps.stack.outputs.decision-index-ref }}
          rebuild: 'true'

      - name: Validate suite orchestration imports
        env:
          PYTHON_PATH: ${{ steps.decision-index.outputs.python-path }}
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: >-
          "$PYTHON_PATH" -c "import artifact_layout, assemble_suite, base_groups, hf_suite_preflight, publish_hf, suite_plan"

      - name: Record suite builder plan
        env:
          PYTHON_PATH: ${{ steps.decision-index.outputs.python-path }}
        run: >-
          "$PYTHON_PATH" scripts/suite_plan.py > artifacts/suite-plan.json

      - name: Build shared NLI normalized shard
        uses: ./.github/actions/build-decision-index-base-shard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
        with:
          python-path: ${{ steps.decision-index.outputs.python-path }}
          decision-index: ${{ steps.decision-index.outputs.executable }}
          catalog-ids: '[11,42]'

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: decision-index-base-shard-011-042
          path: |
            artifacts/base-shard/manifest.json
            artifacts/base-shard/rebuild.log
            artifacts/suite-plan.json

  added-shard:
    name: Decision Index shard / When2Call
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned stack
        id: stack
        uses: ./.github/actions/read-stack

      - name: Set up Decision Index rebuild environment
        id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ steps.stack.outputs.decision-index-ref }}
          rebuild: 'true'

      - name: Build When2Call added shard
        uses: ./.github/actions/build-decision-index-added-shard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
        with:
          decision-index: ${{ steps.decision-index.outputs.executable }}
          catalog-id: '62'

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: decision-index-added-shard-62
          path: |
            artifacts/added-shard/manifest.json
            artifacts/added-shard/rebuild.log
