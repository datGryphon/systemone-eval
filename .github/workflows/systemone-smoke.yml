name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: System One / Julia-1 Q8
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned stack
        id: stack
        uses: ./.github/actions/read-stack

      - name: Record runner profile
        run: python3 scripts/runner_info.py artifacts/runner.json

      - name: Set up llama.cpp
        id: llama
        uses: ./.github/actions/setup-llama
        with:
          ref: ${{ steps.stack.outputs.llama-cpp-ref }}

      - name: Set up Decision Index
        id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ steps.stack.outputs.decision-index-ref }}

      - name: Run native System One smoke
        uses: ./.github/actions/run-systemone-smoke
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
        with:
          server-path: ${{ steps.llama.outputs.server-path }}
          model-profile: julia-1-q8
          output-dir: artifacts/native-smoke

      - name: Run Decision Index HTTP smoke
        uses: ./.github/actions/run-decision-index-smoke
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
        with:
          server-path: ${{ steps.llama.outputs.server-path }}
          decision-index: ${{ steps.decision-index.outputs.executable }}
          model-profile: julia-1-q8

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: systemone-integration
          path: artifacts/

  base-shard:
    name: Decision Index shard / shared NLI builder
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned stack
        id: stack
        uses: ./.github/actions/read-stack

      - name: Set up Decision Index rebuild environment
        id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ steps.stack.outputs.decision-index-ref }}
          rebuild: 'true'

      - name: Exercise shared base builder
        uses: ./.github/actions/build-decision-index-base-shard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
        with:
          decision-index: ${{ steps.decision-index.outputs.executable }}
          catalog-ids: '11 42'
          work-dir: work/base-011-042

      - name: Publish base shard through hf CLI
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_SUITE_REPO: ${{ vars.HF_SUITE_REPO }}
          EDITION: ${{ steps.stack.outputs.decision-index-edition }}
          DI_REF: ${{ steps.stack.outputs.decision-index-ref }}
        run: >-
          "$HF" upload "$HF_SUITE_REPO"
          "work/base-011-042/artifacts/benchmark-suite/normalized"
          "decision-index/$EDITION/$DI_REF/base/011-042/normalized"
          --repo-type dataset
          --commit-message "systemone-eval: CI base shard 011-042"

      - name: Read base shard back through hf CLI
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_SUITE_REPO: ${{ vars.HF_SUITE_REPO }}
          EDITION: ${{ steps.stack.outputs.decision-index-edition }}
          DI_REF: ${{ steps.stack.outputs.decision-index-ref }}
        run: |
          "$HF" download "$HF_SUITE_REPO" --repo-type dataset \
            --include "decision-index/$EDITION/$DI_REF/base/011-042/normalized/*.jsonl" \
            --local-dir /tmp/hf-base-check
          find /tmp/hf-base-check -name '*.jsonl' -type f -print -quit | grep -q .

  added-shard:
    name: Decision Index shard / When2Call
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned stack
        id: stack
        uses: ./.github/actions/read-stack

      - name: Set up Decision Index rebuild environment
        id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ steps.stack.outputs.decision-index-ref }}
          rebuild: 'true'

      - name: Exercise added benchmark builder
        uses: ./.github/actions/build-decision-index-added-shard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
        with:
          decision-index: ${{ steps.decision-index.outputs.executable }}
          edition: ${{ steps.stack.outputs.decision-index-edition }}
          catalog-id: '62'
          work-dir: work/added-062

      - name: Publish added shard through hf CLI
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_SUITE_REPO: ${{ vars.HF_SUITE_REPO }}
          EDITION: ${{ steps.stack.outputs.decision-index-edition }}
          DI_REF: ${{ steps.stack.outputs.decision-index-ref }}
        run: >-
          "$HF" upload "$HF_SUITE_REPO"
          "work/added-062/artifacts/benchmark-suite/release-v2-rebuilt/added-rows.jsonl"
          "decision-index/$EDITION/$DI_REF/added/062/added-rows.jsonl"
          --repo-type dataset
          --commit-message "systemone-eval: CI added shard 062"

      - name: Read added shard back through hf CLI
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_SUITE_REPO: ${{ vars.HF_SUITE_REPO }}
          EDITION: ${{ steps.stack.outputs.decision-index-edition }}
          DI_REF: ${{ steps.stack.outputs.decision-index-ref }}
        run: >-
          "$HF" download "$HF_SUITE_REPO"
          "decision-index/$EDITION/$DI_REF/added/062/added-rows.jsonl"
          --repo-type dataset
          --local-dir /tmp/hf-added-check
