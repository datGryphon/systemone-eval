name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_CPP_REF: 1537a0a8b2f8711d840878b0a0677ab2213c882c

jobs:
  systemone-smoke:
    name: System One / Julia-1 Q8
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record runner profile
        run: python3 scripts/runner_info.py artifacts/runner.json

      - name: Set up llama.cpp
        id: llama
        uses: ./.github/actions/setup-llama
        with:
          ref: ${{ env.LLAMA_CPP_REF }}

      - name: Run Julia-1 smoke
        uses: ./.github/actions/run-systemone-smoke
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
        with:
          server-path: ${{ steps.llama.outputs.server-path }}
          model-profile: julia-1-q8

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: systemone-smoke
          path: artifacts/
