name: Benchmark model

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Saved profile from models.json; leave model_repo blank to use it
        required: false
        default: julia-1-q8
        type: string
      label:
        description: Result label; defaults to profile
        required: false
        default: ""
        type: string
      model_repo:
        description: Ad-hoc Hugging Face GGUF repo; ignores saved model settings
        required: false
        default: ""
        type: string
      quant:
        description: GGUF quant override
        required: false
        default: ""
        type: string
      sample_rows:
        description: Stratified sample rows; 0 runs the full suite
        required: false
        default: 0
        type: number
      shards:
        description: Evaluation shards; 0 uses the profile default
        required: false
        default: 0
        type: number
      max_parallel:
        description: Maximum evaluation jobs running at once
        required: false
        default: 16
        type: number
      ctx_size:
        description: llama.cpp context size override; 0 keeps the profile/default
        required: false
        default: 0
        type: number
      batch_size:
        description: llama.cpp batch size override; 0 keeps the profile/default
        required: false
        default: 0
        type: number
      ubatch_size:
        description: llama.cpp physical batch size override; 0 keeps the profile/default
        required: false
        default: 0
        type: number
      extra_server_args:
        description: Additional llama-server arguments
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Plan benchmark
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.model.outputs.profile }}
      shards: ${{ steps.model.outputs.shards }}
      matrix-a: ${{ steps.model.outputs.matrix-a }}
      matrix-b: ${{ steps.model.outputs.matrix-b }}
      models: ${{ steps.model.outputs.models }}
      decision-index-ref: ${{ steps.stack.outputs.decision-index-ref }}
      edition: ${{ steps.stack.outputs.decision-index-edition }}
      llama-ref: ${{ steps.stack.outputs.llama-cpp-ref }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: stack
        uses: ./.github/actions/read-stack

      - id: model
        name: Resolve model
        env:
          PROFILE: ${{ inputs.profile }}
          LABEL: ${{ inputs.label }}
          MODEL_REPO: ${{ inputs.model_repo }}
          QUANT: ${{ inputs.quant }}
          SHARDS: ${{ inputs.shards }}
          CTX_SIZE: ${{ inputs.ctx_size }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          UBATCH_SIZE: ${{ inputs.ubatch_size }}
          EXTRA_SERVER_ARGS: ${{ inputs.extra_server_args }}
        run: |
          python3 scripts/benchmark_plan.py \
            --models models.json \
            --profile "$PROFILE" \
            --label "$LABEL" \
            --repo "$MODEL_REPO" \
            --quant "$QUANT" \
            --shards "$SHARDS" \
            --ctx-size "$CTX_SIZE" \
            --batch-size "$BATCH_SIZE" \
            --ubatch-size "$UBATCH_SIZE" \
            --extra-server-args "$EXTRA_SERVER_ARGS" \
            --github-output "$GITHUB_OUTPUT"

  evaluate-a:
    name: Evaluate A ${{ matrix.profile }} / ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix-a) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ needs.plan.outputs.decision-index-ref }}

      - id: llama
        uses: ./.github/actions/setup-llama
        with:
          ref: ${{ needs.plan.outputs.llama-ref }}

      - name: Download canonical suite
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_REPO: ${{ vars.HF_SUITE_REPO }}
          EDITION: ${{ needs.plan.outputs.edition }}
          DI_REF: ${{ needs.plan.outputs.decision-index-ref }}
        run: |
          "$HF" download "$HF_REPO" --repo-type dataset --revision main \
            --include "decision-index/$EDITION/$DI_REF/suite/*" \
            --local-dir work/hf

      - name: Write resolved model
        env:
          MODELS: ${{ needs.plan.outputs.models }}
        run: |
          mkdir -p work
          printf '%s\n' "$MODELS" > work/models.json

      - name: Select evaluation rows
        env:
          PYTHON: ${{ steps.decision-index.outputs.python-path }}
          DECISION_INDEX: ${{ steps.decision-index.outputs.executable }}
          EDITION: ${{ needs.plan.outputs.edition }}
          DI_REF: ${{ needs.plan.outputs.decision-index-ref }}
          SAMPLE_ROWS: ${{ inputs.sample_rows }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          source_args=(--suite "work/hf/decision-index/$EDITION/$DI_REF/suite" --edition "$EDITION")
          if (( SAMPLE_ROWS > 0 )); then
            "$DECISION_INDEX" suite sample \
              --edition "$EDITION" \
              --dir "work/hf/decision-index/$EDITION/$DI_REF/suite" \
              --n "$SAMPLE_ROWS" \
              --out work/sample-rows.jsonl.gz
            source_args=(--rows work/sample-rows.jsonl.gz)
          fi

          "$PYTHON" scripts/split_suite.py \
            "${source_args[@]}" \
            --shard "$SHARD" \
            --shards "$SHARDS" \
            --out "work/eval-rows/$SHARD.jsonl.gz"

      - name: Evaluate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
          SERVER: ${{ steps.llama.outputs.server-path }}
          DECISION_INDEX: ${{ steps.decision-index.outputs.executable }}
          SHARD: ${{ matrix.shard }}
          PYTHONUNBUFFERED: "1"
        run: >-
          python3 scripts/evaluate.py
          --server "$SERVER"
          --decision-index "$DECISION_INDEX"
          --rows "work/eval-rows/$SHARD.jsonl.gz"
          --models work/models.json
          --profile "${{ matrix.profile }}"
          --stack stack.json
          --output artifacts/eval-shard

      - name: Publish shard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_REPO: ${{ vars.HF_SUITE_REPO }}
          PROFILE: ${{ matrix.profile }}
          SHARD: ${{ matrix.shard }}
        run: >-
          "$HF" upload "$HF_REPO" artifacts/eval-shard
          "benchmarks/$GITHUB_RUN_ID/$PROFILE/shards/$SHARD"
          --repo-type dataset --revision main

  evaluate-b:
    name: Evaluate B ${{ matrix.profile }} / ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix-b) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ needs.plan.outputs.decision-index-ref }}

      - id: llama
        uses: ./.github/actions/setup-llama
        with:
          ref: ${{ needs.plan.outputs.llama-ref }}

      - name: Download canonical suite
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_REPO: ${{ vars.HF_SUITE_REPO }}
          EDITION: ${{ needs.plan.outputs.edition }}
          DI_REF: ${{ needs.plan.outputs.decision-index-ref }}
        run: |
          "$HF" download "$HF_REPO" --repo-type dataset --revision main \
            --include "decision-index/$EDITION/$DI_REF/suite/*" \
            --local-dir work/hf

      - name: Write resolved model
        env:
          MODELS: ${{ needs.plan.outputs.models }}
        run: |
          mkdir -p work
          printf '%s\n' "$MODELS" > work/models.json

      - name: Select evaluation rows
        env:
          PYTHON: ${{ steps.decision-index.outputs.python-path }}
          DECISION_INDEX: ${{ steps.decision-index.outputs.executable }}
          EDITION: ${{ needs.plan.outputs.edition }}
          DI_REF: ${{ needs.plan.outputs.decision-index-ref }}
          SAMPLE_ROWS: ${{ inputs.sample_rows }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          source_args=(--suite "work/hf/decision-index/$EDITION/$DI_REF/suite" --edition "$EDITION")
          if (( SAMPLE_ROWS > 0 )); then
            "$DECISION_INDEX" suite sample \
              --edition "$EDITION" \
              --dir "work/hf/decision-index/$EDITION/$DI_REF/suite" \
              --n "$SAMPLE_ROWS" \
              --out work/sample-rows.jsonl.gz
            source_args=(--rows work/sample-rows.jsonl.gz)
          fi

          "$PYTHON" scripts/split_suite.py \
            "${source_args[@]}" \
            --shard "$SHARD" \
            --shards "$SHARDS" \
            --out "work/eval-rows/$SHARD.jsonl.gz"

      - name: Evaluate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
          SERVER: ${{ steps.llama.outputs.server-path }}
          DECISION_INDEX: ${{ steps.decision-index.outputs.executable }}
          SHARD: ${{ matrix.shard }}
          PYTHONUNBUFFERED: "1"
        run: >-
          python3 scripts/evaluate.py
          --server "$SERVER"
          --decision-index "$DECISION_INDEX"
          --rows "work/eval-rows/$SHARD.jsonl.gz"
          --models work/models.json
          --profile "${{ matrix.profile }}"
          --stack stack.json
          --output artifacts/eval-shard

      - name: Publish shard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_REPO: ${{ vars.HF_SUITE_REPO }}
          PROFILE: ${{ matrix.profile }}
          SHARD: ${{ matrix.shard }}
        run: >-
          "$HF" upload "$HF_REPO" artifacts/eval-shard
          "benchmarks/$GITHUB_RUN_ID/$PROFILE/shards/$SHARD"
          --repo-type dataset --revision main

  score:
    name: Score ${{ needs.plan.outputs.profile }}
    needs: [plan, evaluate-a, evaluate-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: decision-index
        uses: ./.github/actions/setup-decision-index
        with:
          ref: ${{ needs.plan.outputs.decision-index-ref }}

      - name: Download suite and results
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_REPO: ${{ vars.HF_SUITE_REPO }}
          EDITION: ${{ needs.plan.outputs.edition }}
          DI_REF: ${{ needs.plan.outputs.decision-index-ref }}
          PROFILE: ${{ needs.plan.outputs.profile }}
        run: |
          "$HF" download "$HF_REPO" --repo-type dataset --revision main \
            --include "decision-index/$EDITION/$DI_REF/suite/*" \
            --include "benchmarks/$GITHUB_RUN_ID/$PROFILE/shards/*/decision-index/results.jsonl" \
            --local-dir work/hf

      - name: Combine and score
        env:
          DECISION_INDEX: ${{ steps.decision-index.outputs.executable }}
          EDITION: ${{ needs.plan.outputs.edition }}
          DI_REF: ${{ needs.plan.outputs.decision-index-ref }}
          PROFILE: ${{ needs.plan.outputs.profile }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          SAMPLE_ROWS: ${{ inputs.sample_rows }}
        run: |
          mkdir -p artifacts/eval
          base="work/hf/benchmarks/$GITHUB_RUN_ID/$PROFILE/shards"
          for ((shard=0; shard<SHARDS; shard++)); do
            cat "$base/$shard/decision-index/results.jsonl"
          done > artifacts/eval/results.jsonl

          "$DECISION_INDEX" score \
            --edition "$EDITION" \
            --suite-dir "work/hf/decision-index/$EDITION/$DI_REF/suite" \
            --results artifacts/eval/results.jsonl \
            --engine http \
            --out artifacts/eval

          if (( SAMPLE_ROWS == 0 )); then
            jq -e '.complete == true' artifacts/eval/scores.json
          fi

      - name: Publish scores
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
          HF: ${{ steps.decision-index.outputs.hf-path }}
          HF_REPO: ${{ vars.HF_SUITE_REPO }}
          PROFILE: ${{ needs.plan.outputs.profile }}
        run: >-
          "$HF" upload "$HF_REPO" artifacts/eval
          "benchmarks/$GITHUB_RUN_ID/$PROFILE/summary"
          --exclude results.jsonl
          --repo-type dataset --revision main

      - name: Upload score artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ needs.plan.outputs.profile }}-${{ github.run_id }}
          path: |
            artifacts/eval/benchmark-summary.json
            artifacts/eval/index.json
            artifacts/eval/scores.json
